<style>
  :root{
    --bg-deep:#0f211d;
    --bg-mid:#16352c;
    --bg-card:#173c33;
    --cream:#eaf9e2;
    --cream-dim:#d7ead0;
    --blue:#0b7ec2;
    --blue-light:#3ba7e0;
    --gold:#e9c46a;
    --text-light:#f4fbf1;
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{
    min-height:100%;
    background:
      radial-gradient(circle at 15% 8%, rgba(11,126,194,0.35), transparent 45%),
      radial-gradient(circle at 88% 18%, rgba(233,196,106,0.18), transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(11,126,194,0.25), transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #0c1f1a 100%);
  }
  body{
    min-height:100vh;
    font-family:'Cairo',sans-serif;
    color:var(--text-light);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:56px 18px 80px;
    position:relative;
    overflow-x:hidden;
  }

  /* decorative blobs */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }
  .blob1{width:340px;height:340px;background:var(--blue);top:-120px;right:-100px;animation:float1 14s ease-in-out infinite;}
  .blob2{width:260px;height:260px;background:var(--gold);bottom:-80px;left:-80px;animation:float2 16s ease-in-out infinite;}
  .blob3{width:200px;height:200px;background:#2fae7a;top:45%;left:-100px;animation:float1 18s ease-in-out infinite reverse;}

  @keyframes float1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,40px) scale(1.08);}
  }
  @keyframes float2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-25px,-30px) scale(1.1);}
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:riseIn .8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(22px);}
    to{opacity:1; transform:translateY(0);}
  }

  .card{
    width:100%;
    background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid rgba(234,249,226,0.12);
    backdrop-filter:blur(18px);
    border-radius:28px;
    padding:38px 26px 30px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);
  }

  .logo-ring{
    width:132px;
    height:132px;
    margin:0 auto 18px;
    border-radius:50%;
    padding:5px;
    background:conic-gradient(from 180deg, var(--blue), var(--gold), var(--blue-light), var(--blue));
    box-shadow:0 12px 30px -8px rgba(11,126,194,0.55);
    animation:spin 10s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .logo-ring-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--bg-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:spin-rev 10s linear infinite;
  }
  @keyframes spin-rev{to{transform:rotate(-360deg);}}
  .logo-ring-inner img{
    width:112px;
    height:112px;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }

  h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:.5px;
    color:var(--text-light);
    margin-bottom:6px;
  }
  h1 span{
    color:var(--blue-light);
  }
  .tagline{
    font-size:14.5px;
    line-height:1.9;
    color:var(--cream-dim);
    font-weight:500;
    max-width:340px;
    margin:0 auto 6px;
  }
  .location{
    font-size:12.5px;
    color:var(--gold);
    font-weight:600;
    letter-spacing:.3px;
    margin-bottom:22px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  .social-row{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
  }
  .social-row a{
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(234,249,226,0.08);
    border:1px solid rgba(234,249,226,0.18);
    color:var(--cream);
    transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .social-row a svg{width:19px;height:19px;fill:currentColor;}
  .social-row a:hover{
    transform:translateY(-4px);
    background:var(--blue);
    border-color:var(--blue);
    box-shadow:0 10px 20px -6px rgba(11,126,194,0.6);
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:16px;
    background:var(--cream);
    color:#123128;
    text-decoration:none;
    font-weight:700;
    font-size:15.5px;
    border:1px solid rgba(255,255,255,0.5);
    box-shadow:0 8px 18px -10px rgba(0,0,0,0.4);
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
    overflow:hidden;
  }
  .link-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, rgba(11,126,194,0.15), transparent);
    opacity:0;
    transition:opacity .25s ease;
  }
  .link-btn:hover{
    transform:translateY(-3px) scale(1.01);
    box-shadow:0 16px 28px -12px rgba(11,126,194,0.45);
    background:#ffffff;
  }
  .link-btn:hover::before{opacity:1;}
  .link-btn .icon{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    position:relative;
    z-index:1;
  }
  .link-btn .icon svg{width:19px;height:19px;fill:currentColor;}
  .link-btn .label{position:relative;z-index:1;flex:1;text-align:right;}
  .link-btn .arrow{
    position:relative;
    z-index:1;
    opacity:.45;
    font-size:14px;
  }

  .icon-fb{background:linear-gradient(135deg,#1877f2,#0e5fc9);}
  .icon-wa{background:linear-gradient(135deg,#25D366,#128C4A);}
  .icon-ph{background:linear-gradient(135deg,#0b7ec2,#0a5f92);}
  .icon-cat{background:linear-gradient(135deg,#e9c46a,#c9962f);}
  .icon-ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);}

  footer{
    margin-top:34px;
    text-align:center;
    font-size:12px;
    color:rgba(234,249,226,0.45);
    letter-spacing:.3px;
  }
  footer span{color:var(--blue-light);}

  @media (max-width:380px){
    .card{padding:30px 18px 24px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="wrap">
    <div class="card">
